<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender · WASM Playground</title>
  <meta name="description" content="Modern, minimal WebAssembly playground for the Tender language.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-icon">TD</div>
    <div class="brand-title">Playground</div>
    <span class="badge">WASM</span>
    <div class="status-indicator">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">initializing</span>
    </div>
  </div>

  <div class="controls">
    <select id="exampleSelect" class="example-select">
      <option value="hello">Hello World</option>
      <option value="fibonacci">Fibonacci</option>
      <option value="matrix">Matrix</option>
      <option value="math_complex">Math & Complex</option>
      <option value="strings_regex">Strings & Regex</option>
      <option value="json_base64">JSON & Base64</option>
      <option value="structs">Structs</option>
      <option value="concurrency">Goroutines</option>
      <option value="canvas">Canvas</option>
    </select>

    <button id="runBtn" class="btn btn-primary" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Run
    </button>

    <button id="parseBtn" class="btn btn-secondary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      AST
    </button>

    <button id="clearBtn" class="btn btn-secondary">Clear</button>
  </div>
</header>

<div class="main-container">
  <!-- Editor -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        main.td
      </div>
      <span class="badge-char" id="charCount">0 chars</span>
    </div>
    <div class="editor-wrapper">
      <div class="line-numbers" id="lineNumbers">1</div>
      <textarea id="codeEditor" class="code-editor" spellcheck="false" placeholder="Write Tender code here…"></textarea>
    </div>
  </div>

  <!-- Output panel -->
  <div class="panel">
    <div class="panel-header">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="consoleTab">Console</button>
        <button class="tab-btn" data-tab="astTab">AST</button>
        <button class="tab-btn" data-tab="modulesTab">Modules</button>
      </div>
    </div>

    <div id="consoleTab" class="tab-content active">
      <pre id="consoleOutput" class="console-output">Ready · WASM engine loading…</pre>
    </div>
    <div id="astTab" class="tab-content">
      <pre id="astOutput" class="json-ast">Click “AST” to inspect.</pre>
    </div>
    <div id="modulesTab" class="tab-content">
      <div id="modulesGrid" class="modules-grid"></div>
    </div>
  </div>
</div>

<footer>
  <div><kbd>Shift</kbd> + <kbd>Enter</kbd> to run</div>
  <div id="modulesCountInfo">stdlib: os, gl, glut, glfw, glu, win excluded</div>
</footer>

<!-- wasm_exec.js (loaded externally) -->
<script src="wasm_exec.js"></script>
<!-- app.js remains separate and contains all the original logic -->
<script src="app.js"></script>
</body>
</html>
